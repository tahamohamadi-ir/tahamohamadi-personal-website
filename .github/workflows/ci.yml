name: TahaMohamadi.ir CI Pipeline

on:
  push:
    branches: [ main, develop, "feat/*" ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-test:
    name: Backend Unit Tests (Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Run Backend Tests
        run: |
          cd backend
          ./mvnw test -Dtest="*UnitTest,*Test,!*IntegrationTest,!*SmokeTest"

  frontend-test:
    name: Frontend Unit Tests & SSR Build (Node 20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci
      - name: Run Vitest Unit Tests
        run: |
          cd frontend
          npm run test:unit
      - name: Build SSR Frontend Production Bundle
        run: |
          cd frontend
          npm run build
